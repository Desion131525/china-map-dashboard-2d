<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国2D地图数据看板</title>
    <meta name="description" content="中国2D地图数据可视化看板，基于ECharts实现">

    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <!-- 本地样式 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>中国2D地图数据看板</h1>
            <p class="subtitle">实时数据可视化与分析</p>
        </header>

        <main class="main-content">
            <div class="dashboard-grid">
                <!-- 地图容器 -->
                <div class="chart-container map-container">
                    <h2>中国地图分布</h2>
                    <div id="china-map" class="chart" style="height: 500px;"></div>
                </div>

                <!-- 数据指标卡片 -->
                <div class="metrics-container">
                    <div class="metric-card">
                        <h3>总数据量</h3>
                        <div class="metric-value" id="total-data">0</div>
                    </div>
                    <div class="metric-card">
                        <h3>省份数量</h3>
                        <div class="metric-value" id="province-count">34</div>
                    </div>
                    <div class="metric-card">
                        <h3>更新时间</h3>
                        <div class="metric-value" id="update-time">--:--:--</div>
                    </div>
                </div>
            </div>

            <!-- 图表区域 -->
            <div class="charts-row">
                <div class="chart-container">
                    <h2>数据趋势分析</h2>
                    <div id="trend-chart" class="chart" style="height: 300px;"></div>
                </div>
                <div class="chart-container">
                    <h2>区域分布</h2>
                    <div id="distribution-chart" class="chart" style="height: 300px;"></div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2024 中国2D地图数据看板. 基于ECharts构建.</p>
        </footer>
    </div>

    <!-- 本地JavaScript -->
    <script src="js/app.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
